version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: ecoeats-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./fixtures.sql:/docker-entrypoint-initdb.d/02-fixtures.sql
    networks:
      - ecoeats-network

volumes:
  postgres_data:

networks:
  ecoeats-network:
    driver: bridge